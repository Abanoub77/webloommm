    <radialGradient id="atlasGlow" cx=".2" cy=".1" r=".7">
      <stop offset="0" stop-color="#b4ff39" stop-opacity=".12"/>
      <stop offset="1" stop-color="#b4ff39" stop-opacity="0"/>
