<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="atlasTitle">
  <title id="atlasTitle">Atlas data platform analytics interface</title>
  <defs>
    <linearGradient id="atlasBg" x1="0" y1="0" x2="1" y2="1">
