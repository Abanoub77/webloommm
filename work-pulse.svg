<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="pulseTitle">
  <title id="pulseTitle">Pulse Fit mobile fitness app</title>
  <defs>
    <radialGradient id="pulseGlow" cx=".3" cy=".45" r=".55">
      <stop offset="0" stop-color="#b4ff39" stop-opacity=".17"/>
      <stop offset="1" stop-color="#b4ff39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pulsePhone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161d15"/>
      <stop offset="1" stop-color="#0a0d0a"/>
    </linearGradient>
    <linearGradient id="pulseLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4ff39" stop-opacity=".35"/>
      <stop offset="1" stop-color="#b4ff39" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="#060906"/>
  <rect width="800" height="600" fill="url(#pulseGlow)"/>
  <circle cx="700" cy="120" r="170" fill="#b4ff39" opacity=".05"/>
  <circle cx="120" cy="520" r="140" fill="#b4ff39" opacity=".04"/>

  <text x="44" y="52" font-family="Arial" font-size="12" font-weight="700" letter-spacing="4.5" fill="#f2f4ee">PULSE</text>
  <text x="756" y="52" text-anchor="end" font-family="Arial" font-size="7" letter-spacing="2" fill="#6d7568">FITNESS / PRODUCT / 2024</text>

  <g opacity=".35" stroke="#263022" fill="none">
    <path d="M0 480h800M0 500h800"/>
  </g>

  <!-- phone 1 -->
  <g transform="rotate(-5 285 300)">
    <rect x="180" y="58" width="210" height="438" rx="34" fill="url(#pulsePhone)" stroke="#2c3628" stroke-width="1.5"/>
    <rect x="190" y="68" width="190" height="418" rx="26" fill="#0f1510"/>
    <rect x="254" y="75" width="62" height="14" rx="7" fill="#060906"/>
    <text x="208" y="90" font-family="Arial" font-size="7" font-weight="700" fill="#d9ded3">9:41</text>
    <g fill="#7d8476"><rect x="340" y="84" width="9" height="6" rx="1"/><rect x="353" y="83" width="8" height="7" rx="1" opacity=".55"/></g>

    <text x="208" y="130" font-family="Arial" font-size="7" fill="#7d8476">GOOD MORNING</text>
    <text x="208" y="152" font-family="Arial" font-size="18" font-weight="700" fill="#f2f4ee">Sam.</text>
    <circle cx="354" cy="139" r="12" fill="#b4ff39" fill-opacity=".14" stroke="#b4ff39" stroke-opacity=".4"/>
    <text x="354" y="143" text-anchor="middle" font-family="Arial" font-size="7" font-weight="700" fill="#b4ff39">S</text>

    <circle cx="285" cy="224" r="30" fill="none" stroke="#232d20" stroke-width="8"/>
    <circle cx="285" cy="224" r="38" fill="none" stroke="#1b2418" stroke-width="1"/>
    <circle cx="285" cy="224" r="30" fill="none" stroke="#b4ff39" stroke-width="8" stroke-linecap="round"
      stroke-dasharray="152 190" transform="rotate(-90 285 224)"/>
    <text x="285" y="223" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#f2f4ee">8,420</text>
    <text x="285" y="235" text-anchor="middle" font-family="Arial" font-size="5.5" letter-spacing="1" fill="#7d8476">STEPS</text>

    <g font-family="Arial">
      <rect x="208" y="275" width="50" height="44" rx="8" fill="#141b13"/>
      <text x="233" y="294" text-anchor="middle" font-size="8" font-weight="700" fill="#f2f4ee">12.4k</text>
      <text x="233" y="306" text-anchor="middle" font-size="5" fill="#6d7568">KCAL</text>

      <rect x="265" y="275" width="50" height="44" rx="8" fill="#141b13"/>
      <text x="290" y="294" text-anchor="middle" font-size="8" font-weight="700" fill="#f2f4ee">48</text>
      <text x="290" y="306" text-anchor="middle" font-size="5" fill="#6d7568">MIN</text>

      <rect x="322" y="275" width="50" height="44" rx="8" fill="#141b13"/>
      <text x="347" y="294" text-anchor="middle" font-size="8" font-weight="700" fill="#b4ff39">7.2</text>
      <text x="347" y="306" text-anchor="middle" font-size="5" fill="#6d7568">KM</text>
    </g>

    <text x="208" y="350" font-family="Arial" font-size="8" font-weight="700" fill="#d9ded3">Today's plan</text>
    <text x="362" y="350" text-anchor="end" font-family="Arial" font-size="6" fill="#b4ff39">EDIT</text>

    <rect x="208" y="362" width="164" height="38" rx="9" fill="#141b13"/>
    <circle cx="227" cy="381" r="10" fill="#b4ff39" fill-opacity=".14"/>
    <path d="m223 381 3 3 5-6" fill="none" stroke="#b4ff39" stroke-width="1.4" stroke-linecap="round"/>
    <text x="244" y="378" font-family="Arial" font-size="7" font-weight="700" fill="#e6eadf">Morning flow</text>
    <text x="244" y="388" font-family="Arial" font-size="5.5" fill="#6d7568">12 min · Mobility</text>
    <path d="m360 377 3 4 3-4" fill="none" stroke="#6d7568" stroke-width="1.2"/>

    <rect x="208" y="408" width="164" height="38" rx="9" fill="#10160f" stroke="#1e271c"/>
    <circle cx="227" cy="427" r="10" fill="#1e271c"/>
    <path d="M225 423v8M229 423v8" stroke="#8b9385" stroke-width="1.4"/>
    <text x="244" y="424" font-family="Arial" font-size="7" font-weight="700" fill="#d9ded3">Strength 02</text>
    <text x="244" y="434" font-family="Arial" font-size="5.5" fill="#6d7568">24 min · Upper body</text>

    <rect x="214" y="456" width="142" height="20" rx="10" fill="#0a0e0a"/>
    <circle cx="248" cy="466" r="3" fill="#b4ff39"/>
    <circle cx="285" cy="466" r="3" fill="#3a4435"/>
    <circle cx="322" cy="466" r="3" fill="#3a4435"/>
    <line x1="260" y1="482" x2="310" y2="482" stroke="#3a4435" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- phone 2 -->
  <g transform="rotate(6 500 320)">
    <rect x="398" y="108" width="204" height="426" rx="34" fill="url(#pulsePhone)" stroke="#2c3628" stroke-width="1.5"/>
    <rect x="408" y="118" width="184" height="406" rx="26" fill="#0e140e"/>
    <rect x="470" y="125" width="60" height="12" rx="6" fill="#060906"/>

    <text x="426" y="158" font-family="Arial" font-size="6" letter-spacing="1.2" fill="#b4ff39">HIIT · 24 MIN</text>
    <text x="426" y="184" font-family="Arial" font-size="20" font-weight="700" fill="#f2f4ee">Burn.</text>
    <text x="426" y="198" font-family="Arial" font-size="6.5" fill="#7d8476">Full body · No equipment</text>

    <rect x="424" y="214" width="152" height="112" rx="12" fill="#131a12" stroke="#1e271c"/>
    <text x="438" y="234" font-family="Arial" font-size="5.5" letter-spacing="1" fill="#6d7568">HEART RATE</text>
    <text x="438" y="256" font-family="Arial" font-size="19" font-weight="700" fill="#b4ff39">148</text>
    <text x="470" y="256" font-family="Arial" font-size="6" fill="#7d8476">BPM</text>
    <path d="M436 296h22l6-12 7 22 8-16 7 8 8-18 6 16h46" fill="none" stroke="#b4ff39" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M436 296h22l6-12 7 22 8-16 7 8 8-18 6 16h46v8h-116Z" fill="url(#pulseLine)"/>

    <g font-family="Arial">
      <rect x="424" y="338" width="72" height="40" rx="9" fill="#131a12"/>
      <text x="460" y="355" text-anchor="middle" font-size="8" font-weight="700" fill="#f2f4ee">312</text>
      <text x="460" y="366" text-anchor="middle" font-size="5" fill="#6d7568">KCAL</text>
      <rect x="504" y="338" width="72" height="40" rx="9" fill="#131a12"/>
      <text x="540" y="355" text-anchor="middle" font-size="8" font-weight="700" fill="#f2f4ee">24:00</text>
      <text x="540" y="366" text-anchor="middle" font-size="5" fill="#6d7568">TIME</text>
    </g>

    <circle cx="500" cy="440" r="42" fill="none" stroke="#b4ff39" stroke-opacity=".2"/>
    <circle cx="500" cy="440" r="34" fill="#b4ff39"/>
    <path d="M494 429l14 11-14 11Z" fill="#050605"/>
    <text x="500" y="492" text-anchor="middle" font-family="Arial" font-size="6" letter-spacing="1.4" fill="#7d8476">START WORKOUT</text>
    <line x1="472" y1="510" x2="528" y2="510" stroke="#3a4435" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- floating badges -->
  <rect x="596" y="470" width="152" height="50" rx="12" fill="#0e120e" stroke="#2a3426"/>
  <text x="612" y="490" font-family="Arial" font-size="11" font-weight="700" fill="#b4ff39">4.9 ★</text>
  <text x="612" y="506" font-family="Arial" font-size="6" letter-spacing=".6" fill="#7d8476">APP STORE RATING</text>

  <rect x="66" y="128" width="124" height="44" rx="11" fill="#0e120e" stroke="#2a3426"/>
  <text x="80" y="147" font-family="Arial" font-size="10" font-weight="700" fill="#f2f4ee">+38%</text>
  <text x="80" y="160" font-family="Arial" font-size="5.5" letter-spacing=".6" fill="#7d8476">WEEKLY RETENTION</text>

  <text x="690" y="300" transform="rotate(-90 690 300)" text-anchor="middle" font-family="Arial" font-size="7" letter-spacing="3" fill="#3d4a38">MOVE DAILY · LIVE WELL</text>
</svg>
