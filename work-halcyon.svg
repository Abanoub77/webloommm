<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="halcyonTitle">
  <title id="halcyonTitle">Halcyon skincare e-commerce storefront</title>
  <defs>
    <linearGradient id="halBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef0e6"/>
      <stop offset="1" stop-color="#e2e6d8"/>
    </linearGradient>
    <linearGradient id="halPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4e8da"/>
      <stop offset="1" stop-color="#cfd7c1"/>
    </linearGradient>
    <linearGradient id="halBottle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c7052"/>
      <stop offset=".5" stop-color="#28452f"/>
      <stop offset="1" stop-color="#15281b"/>
    </linearGradient>
    <radialGradient id="halLight" cx=".35" cy=".25" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#halBg)"/>

  <!-- nav -->
  <text x="40" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="19" letter-spacing="5" fill="#1b2b1f">HALCYON</text>
  <g font-family="Arial" font-size="8" letter-spacing="1.2" fill="#4b5749">
    <text x="420" y="46">SHOP</text>
    <text x="480" y="46">SCIENCE</text>
    <text x="558" y="46">JOURNAL</text>
    <text x="638" y="46">ACCOUNT</text>
  </g>
  <text x="742" y="46" font-family="Arial" font-size="8" letter-spacing="1" fill="#1b2b1f">BAG (2)</text>
  <line x1="0" y1="70" x2="800" y2="70" stroke="#c6cdba"/>

  <!-- left visual panel -->
  <rect x="0" y="71" width="430" height="529" fill="url(#halPanel)"/>
  <circle cx="215" cy="305" r="165" fill="none" stroke="#b3bfa6" stroke-width="1"/>
  <circle cx="215" cy="305" r="118" fill="none" stroke="#b3bfa6" stroke-width="1" stroke-dasharray="2 5"/>
  <circle cx="215" cy="305" r="230" fill="none" stroke="#c1cbb4" stroke-width="1"/>
  <text x="46" y="472" font-family="Arial" font-size="150" font-weight="700" fill="#c3cdb6" opacity=".55">01</text>
  <ellipse cx="215" cy="470" rx="118" ry="18" fill="#1c2b20" opacity=".16"/>

  <!-- product bottle -->
  <g>
    <rect x="188" y="150" width="54" height="52" rx="7" fill="#182a1e"/>
    <rect x="198" y="140" width="34" height="18" rx="5" fill="#243a29"/>
    <rect x="203" y="128" width="24" height="16" rx="4" fill="#2f4a34"/>
    <rect x="158" y="198" width="114" height="246" rx="20" fill="url(#halBottle)"/>
    <rect x="170" y="208" width="18" height="220" rx="9" fill="#ffffff" opacity=".1"/>
    <rect x="254" y="216" width="6" height="210" rx="3" fill="#ffffff" opacity=".07"/>
    <rect x="172" y="262" width="86" height="92" rx="3" fill="#eff1e7"/>
    <text x="215" y="288" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" letter-spacing="2.6" fill="#22361f">HALCYON</text>
    <line x1="188" y1="297" x2="242" y2="297" stroke="#a9b49e"/>
    <text x="215" y="312" text-anchor="middle" font-family="Arial" font-size="6" letter-spacing="1.6" fill="#556350">SERUM 01</text>
    <text x="215" y="327" text-anchor="middle" font-family="Arial" font-size="5.5" letter-spacing="1" fill="#7c8876">RADIANCE CONCENTRATE</text>
    <text x="215" y="343" text-anchor="middle" font-family="Arial" font-size="5.5" letter-spacing="1" fill="#7c8876">30 ML / 1.0 FL OZ</text>
  </g>

  <!-- botanical accents -->
  <g stroke="#5f7a58" stroke-width="1.2" fill="none" opacity=".65">
    <path d="M330 440c18-12 30-32 32-54"/>
    <path d="M342 424c-14-2-24-12-26-25 14 1 24 11 26 25Z"/>
    <path d="M349 400c15 0 26-9 30-22-15 0-26 9-30 22Z"/>
    <path d="M60 200c-10 12-12 28-6 42"/>
    <path d="M54 214c12 2 20 12 20 24-12-2-19-12-20-24Z"/>
  </g>

  <rect x="46" y="108" width="92" height="24" rx="12" fill="#1c2f20"/>
  <text x="92" y="123" text-anchor="middle" font-family="Arial" font-size="6.5" letter-spacing="1.4" fill="#e8ecdd">BESTSELLER</text>

  <!-- right product info -->
  <text x="470" y="150" font-family="Arial" font-size="7.5" letter-spacing="1.8" fill="#6c7a67">NEW · CONCENTRATED SERUM</text>
  <text x="470" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#17261b">Quiet luxury,</text>
  <text x="470" y="233" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#17261b">loud results.</text>

  <g fill="#2e4a32" font-family="Arial" font-size="9">
    <text x="470" y="263">★★★★★</text>
  </g>
  <text x="518" y="263" font-family="Arial" font-size="7.5" fill="#7c8876">4.9 · 1,248 reviews</text>

  <text x="470" y="305" font-family="Arial" font-size="9" fill="#7c8876">A featherweight, fast-absorbing serum that visibly</text>
  <text x="470" y="320" font-family="Arial" font-size="9" fill="#7c8876">firms, brightens and restores your natural glow.</text>

  <text x="470" y="360" font-family="Arial" font-size="23" font-weight="700" fill="#17261b">$128</text>
  <text x="518" y="360" font-family="Arial" font-size="8" fill="#8b9685">/ 30ml</text>

  <rect x="470" y="380" width="278" height="48" rx="24" fill="#1a2e1f"/>
  <text x="609" y="409" text-anchor="middle" font-family="Arial" font-size="9" letter-spacing="1.4" fill="#eef1e5">ADD TO BAG — $128</text>

  <circle cx="478" cy="456" r="3" fill="#4f6d4b"/>
  <text x="488" y="459" font-family="Arial" font-size="7.5" fill="#6c7a67">Free carbon-neutral shipping over $75</text>
  <circle cx="478" cy="476" r="3" fill="#4f6d4b"/>
  <text x="488" y="479" font-family="Arial" font-size="7.5" fill="#6c7a67">30-day returns · Dermatologist tested</text>

  <line x1="470" y1="502" x2="748" y2="502" stroke="#c6cdba"/>
  <g font-family="Arial" font-size="6" letter-spacing=".8" fill="#7c8876">
    <circle cx="480" cy="528" r="14" fill="none" stroke="#aab6a1"/>
    <path d="M476 528c2-4 6-4 8 0" fill="none" stroke="#4f6d4b" stroke-width="1.2"/>
    <text x="480" y="553" text-anchor="middle">VEGAN</text>

    <circle cx="536" cy="528" r="14" fill="none" stroke="#aab6a1"/>
    <path d="M532 532c0-5 2-9 8-10-1 5-3 9-8 10Z" fill="none" stroke="#4f6d4b" stroke-width="1.2"/>
    <text x="536" y="553" text-anchor="middle">BOTANICAL</text>

    <circle cx="592" cy="528" r="14" fill="none" stroke="#aab6a1"/>
    <path d="M586 528h10M588 524h6M588 532h6" stroke="#4f6d4b" stroke-width="1.2" stroke-linecap="round"/>
    <text x="592" y="553" text-anchor="middle">CLINICAL</text>
  </g>

  <text x="748" y="552" text-anchor="end" font-family="Arial" font-size="6.5" letter-spacing="1.2" fill="#9aa594">AS SEEN IN VOGUE · GQ · ELLE</text>
</svg>
